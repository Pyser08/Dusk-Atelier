<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>기억 개요 디자인</title>
<style>
:root{
  --bg:#171028;--b1:rgba(255,154,118,.45);--b2:rgba(176,124,255,.55);--b3:rgba(255,142,198,.4);--b4:rgba(120,90,255,.4);
  --acc:#ff9a76;--acc2:#b07cff;--tint:#ffd6e6;--glow:rgba(255,154,118,.5);
  --secg:linear-gradient(135deg,#ff8ec6,#8a7bff);--accg:linear-gradient(90deg,var(--acc),var(--acc2));
  --glass:color-mix(in srgb,#171028 44%,transparent);--cell:rgba(255,255,255,.08);--line:rgba(255,255,255,.2);
  --text:#f2f0fa;--sub:rgba(255,255,255,.84);--mute:rgba(255,255,255,.62);--rl:rgba(255,255,255,.1);
}
*{box-sizing:border-box}
body{margin:0;background:#0b0816;color:var(--text);font:14px/1.5 "Pretendard",system-ui,sans-serif;padding:20px 16px}
b{font-weight:700}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 10px}
.bar button{padding:7px 14px;border-radius:999px;border:1px solid #444;background:#1b1530;color:#ddd;font:inherit;cursor:pointer}
.bar button.on{background:var(--secg);color:#fff;border:0}
.cap{color:#bbb;font-size:13px;margin:0 auto 14px;max-width:1100px;text-align:center}
.wrap{display:flex;gap:32px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.frame{border-radius:22px;overflow:hidden;border:1px solid #333}
.pc{width:1280px;max-width:100%}.mo{width:390px}
.stage{background:radial-gradient(40% 50% at 12% 18%,var(--b1),transparent 70%),radial-gradient(45% 55% at 88% 78%,var(--b2),transparent 70%),radial-gradient(35% 40% at 70% 8%,var(--b3),transparent 70%),radial-gradient(40% 45% at 30% 95%,var(--b4),transparent 70%),var(--bg);padding:22px;display:flex;gap:16px;min-height:760px}
.gl{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.22)}
.rail{width:68px;flex:none;display:flex;flex-direction:column;gap:6px;padding:14px 10px;align-items:center}
.ri{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:13px;color:var(--sub)}
.ri.on{background:var(--secg);color:#fff;box-shadow:0 0 14px rgba(217,140,255,.5)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.mut{color:var(--mute);font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;background:#5fe0a8;box-shadow:0 0 8px #5fe0a8;flex:none;display:inline-block}
.cta{display:inline-block;padding:8px 16px;border-radius:999px;background:var(--accg);color:#fff;font-weight:700;box-shadow:0 0 18px var(--glow);white-space:nowrap}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--cell);font-size:12px;color:var(--sub);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto}.chips .chip{padding:5px 12px;font-size:12.5px}
.chips .on{color:#fff;box-shadow:inset 0 0 0 1px #d98cff,0 0 10px rgba(217,140,255,.35)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.c1{--c:#ff8ec6;--cg:linear-gradient(135deg,#ff8ec6,#8a7bff)}.c2{--c:#5b8cff;--cg:linear-gradient(135deg,#7fd4ff,#5b8cff)}.c3{--c:#38c6a0;--cg:linear-gradient(135deg,#6ff0c4,#38b6a0)}.c4{--c:#ff8a5c;--cg:linear-gradient(135deg,#ffb36b,#ff7a59)}
.ico{background:var(--cg)}
.head{display:flex;align-items:flex-end;gap:12px}.head .sp{flex:1}
.ttl{font-size:26px;font-weight:800;background:linear-gradient(90deg,#fff,var(--tint));-webkit-background-clip:text;color:transparent}
.q{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--sub);flex:none}
.stat{padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stat .mut{min-width:220px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{padding:16px 18px;display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden}
.tile .t{flex:1;min-width:0}.tile .t b{font-size:15px;display:block}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rl);font-size:13px}.row:last-child{border:0}.row .t{flex:1}
.who{font-size:11.5px;padding:2px 8px;border-radius:999px;background:rgba(217,140,255,.18);color:#f1d9ff}
.big{font-size:30px;font-weight:800;line-height:1;background:linear-gradient(180deg,#fff,var(--tint));-webkit-background-clip:text;color:transparent}
.mo .stage{flex-direction:column-reverse;padding:14px 16px 0;min-height:844px}
.mo .rail{width:auto;flex-direction:row;justify-content:space-around;padding:8px;border-radius:20px 20px 0 0}
.mo .hp{display:none!important}.pc .hm{display:none!important}
.mo .ttl{font-size:21px}
.mo .tiles{gap:12px}.mo .tile{flex-direction:column;gap:8px;padding:14px}.mo .tile>.arr,.mo .tile>.t+*:not(.t){display:none}

/* 1 빛 모서리: 타일 오른쪽 위에 기능 색 빛, 화살표 원 */
.v1 .tile::after{content:"";position:absolute;width:180px;height:180px;right:-70px;top:-70px;border-radius:50%;background:var(--c);filter:blur(45px);opacity:.45;pointer-events:none}
.v1 .arr{width:30px;height:30px;border-radius:50%;background:var(--cell);display:grid;place-items:center;flex:none}
.v1 .stat .dot{width:11px;height:11px}

/* 2 그라데이션 테두리 + 큰 숫자 */
.v2 .tile{border:1px solid transparent;background:linear-gradient(var(--glass),var(--glass)) padding-box,linear-gradient(135deg,var(--c),transparent 60%) border-box;flex-direction:column;gap:10px}
.v2 .tile .top{display:flex;align-items:center;gap:10px;width:100%}
.v2 .tile .ico{width:32px;height:32px;border-radius:10px}
.v2 .tile .nb{display:flex;align-items:baseline;gap:8px}
.v2 .stat{border:1px solid transparent;background:linear-gradient(var(--glass),var(--glass)) padding-box,var(--accg) border-box}

/* 3 왼쪽 색띠 · 차분 */
.v3 .gl{border-radius:16px}
.v3 .tile{padding-left:22px}
.v3 .tile::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--cg);box-shadow:0 0 12px var(--c)}
.v3 .tile .ico{background:var(--cell);color:var(--c);box-shadow:none}
.v3 .stat{padding:12px 18px}
.v3 .stat::before{content:"";width:4px;align-self:stretch;border-radius:4px;background:#5fe0a8;box-shadow:0 0 10px #5fe0a8}

/* 4 색 머리띠 카드 */
.v4 .tile{padding:0;flex-direction:column;gap:0}
.v4 .band{height:64px;width:100%;background:var(--cg);position:relative;display:flex;align-items:flex-end;padding:0 16px}
.v4 .band::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 120% at 80% 0%,rgba(255,255,255,.35),transparent 60%)}
.v4 .band .ico{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);transform:translateY(50%);backdrop-filter:blur(8px);z-index:1}
.v4 .tile .t{padding:28px 16px 16px}
.v4 .stat{background:linear-gradient(90deg,rgba(95,224,168,.18),transparent 60%),var(--glass)}

/* 5 네온 선 */
.v5 .gl{background:rgba(14,9,26,.55);border-color:rgba(255,255,255,.12)}
.v5 .tile{transition:.2s}
.v5 .tile .ico{background:none;border:1.5px solid var(--c);color:var(--c);box-shadow:0 0 12px var(--c),inset 0 0 10px color-mix(in srgb,var(--c) 40%,transparent);text-shadow:0 0 8px var(--c)}
.v5 .tile.hov{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 24px color-mix(in srgb,var(--c) 50%,transparent)}
.v5 .ttl{background:none;color:#fff;text-shadow:0 0 18px rgba(217,140,255,.8)}
.v5 .cta{background:none;border:1.5px solid var(--acc);color:#ffd1bf;box-shadow:0 0 14px var(--glow)}

/* 6 = 3 왼쪽 색띠 + 약한 네온 */
.v6 .gl{border-radius:16px}
.v6 .tile{padding-left:22px}
.v6 .tile::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--cg);box-shadow:0 0 10px var(--c)}
.v6 .tile .ico{background:color-mix(in srgb,var(--c) 10%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 35%,transparent);text-shadow:0 0 6px color-mix(in srgb,var(--c) 60%,transparent)}
.v6 .tile.hov{border-color:color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 8px 30px rgba(0,0,0,.25),0 0 16px color-mix(in srgb,var(--c) 22%,transparent)}
.v6 .stat{padding:12px 18px}
.v6 .stat::before{content:"";width:4px;align-self:stretch;border-radius:4px;background:#5fe0a8;box-shadow:0 0 10px #5fe0a8}
.v6 .cta{background:color-mix(in srgb,var(--acc) 14%,transparent);border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);color:#ffd9ca;box-shadow:0 0 10px color-mix(in srgb,var(--acc) 30%,transparent)}
.v6 .ttl{text-shadow:0 0 14px rgba(217,140,255,.35)}
</style></head><body>
<div class="bar" id="bar"></div>
<p class="cap" id="cap"></p>
<div class="wrap" id="wrap"></div>
<script>
const SV=(d)=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC={brain:SV('<path d="M9 4a3 3 0 0 0-3 3v.5A3 3 0 0 0 4 10.5a3 3 0 0 0 1 2.2A3 3 0 0 0 6 18a3 3 0 0 0 3 2V4z"/><path d="M15 4a3 3 0 0 1 3 3v.5a3 3 0 0 1 2 3 3 3 0 0 1-1 2.2A3 3 0 0 1 18 18a3 3 0 0 1-3 2V4z"/>'),
network:SV('<circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="18" r="2.2"/><path d="M11 7 6 16M13 7l5 9M7.2 18h9.6"/>'),
sliders:SV('<path d="M5 4v16M12 4v16M19 4v16"/><circle cx="5" cy="9" r="2" fill="currentColor"/><circle cx="12" cy="15" r="2" fill="currentColor"/><circle cx="19" cy="7" r="2" fill="currentColor"/>'),
sparkle:SV('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>'),
home:SV('<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>'),
layers:SV('<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>'),
wrench:SV('<path d="M14.7 6.3a4 4 0 0 0 5 5L13 18a2.1 2.1 0 0 1-3-3z"/><path d="M14.7 6.3 17 4"/>'),
gear:SV('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>')};
const F=[[IC.brain,"장기 기억","저장 6 · 미처리 4","응답마다 인물별 기억을 쌓고 필요할 때 꺼내요.","6","저장된 기록"],[IC.network,"인물 관계도","인물 2명 · 이번 턴 1명","거리·관계를 한눈에 봐요.","2","인물"],[IC.sliders,"코코아","스킬 0개 · 꺼짐","정리 노트·기록하기에 붙는 스킬.","0","스킬"],[IC.sparkle,"기억 카드","만든 카드 0장","기억을 카드로 만들어 새 봇으로.","0","만든 카드"]];
const V={
 v1:{n:"1 · 빛 모서리",c:"지금 목업 그대로에 타일마다 기능 색 빛을 오른쪽 위에 번지게. 화살표는 둥근 칸. 가장 무난."},
 v2:{n:"2 · 그라데이션 테두리",c:"타일 테두리를 기능 색 → 투명 그라데이션으로, 안에는 큰 숫자. 상태 줄은 강조 그라데이션 테두리. 숫자가 먼저 눈에 들어옴."},
 v3:{n:"3 · 왼쪽 색띠",c:"차분한 판: 왼쪽에 빛나는 색띠 하나, 아이콘은 옅은 칸에 색 글자. 화려함을 줄이고 읽기 편하게(가벼운 화면과도 잘 맞음)."},
 v4:{n:"4 · 색 머리띠",c:"타일 위쪽을 기능 색 띠로 채우고 아이콘이 띠에 반쯤 걸친 카드. 가장 ‘카드’ 같고 화사함."},
 v6:{n:"6 · 색띠+약한 네온",c:"3번(왼쪽 색띠·차분)이 바탕, 5번 네온은 약하게: 아이콘 얇은 색 테두리+옅은 빛, 분석 버튼은 테두리형, 올리면(첫 타일 예시) 테두리에 옅은 색 빛."},
 v5:{n:"5 · 네온 선",c:"어두운 유리 + 아이콘·제목만 네온 선 발광. 올리면(첫 타일 예시) 테두리가 기능 색으로 빛남. 밤 분위기 테마에 어울림."},
};
const rail=`<nav class="rail gl">${[IC.home,IC.brain,IC.layers,IC.wrench,IC.gear].map((t,i)=>`<div class="ri ${i==1?"on":""}">${t}</div>`).join("")}</nav>`;
const tile=(f,i,v)=>{const cls=`gl tile c${i+1} ${(v=="v5"||v=="v6")&&i==0?"hov":""}`;
 if(v=="v2")return `<div class="${cls}"><div class="top"><span class="ico">${f[0]}</span><b style="flex:1">${f[1]}</b>›</div><div class="nb"><span class="big">${f[4]}</span><span class="mut">${f[5]}</span></div><div class="mut">${f[3]}</div></div>`;
 if(v=="v4")return `<div class="${cls}"><div class="band"><span class="ico">${f[0]}</span></div><div class="t"><b>${f[1]}</b><span class="chip" style="margin:4px 0">${f[2]}</span><div class="mut">${f[3]}</div></div></div>`;
 return `<div class="${cls}"><span class="ico">${f[0]}</span><span class="t"><b>${f[1]}</b><span class="chip" style="margin:4px 0">${f[2]}</span><div class="mut">${f[3]}</div></span>${v=="v1"?`<span class="arr">›</span>`:"›"}</div>`;};
const body=(v)=>`<div class="hp mut">⌂ 홈 › <b style="color:var(--text)">기억</b></div>
<div class="head"><div><div class="ttl">기억</div><div class="mut">인물 기억·관계·스킬·카드를 한곳에서</div></div><span class="sp"></span><span class="q">?</span></div>
<div class="chips hm">${["개요","장기 기억","관계도","코코아","기억 카드"].map((t,i)=>`<span class="chip ${i==0?"on":""}">${t}</span>`).join("")}</div>
<section class="gl stat"><span class="dot"></span><b>시로코 · 교실 이야기</b><span class="mut" style="flex:1">장기 기억 사용 중 · 기억 3건을 넣었어요</span><span class="cta">지난 대화 분석 4</span></section>
<div class="tiles">${F.map((f,i)=>tile(f,i,v)).join("")}</div>
<section class="gl" style="padding:16px 20px"><div style="display:flex;margin-bottom:4px"><b style="flex:1">최근 기록</b><span class="mut">전체 보기 ›</span></div>${[["호시노","선생님에게 잔소리를 들었다","07:20"],["시로코","호시노를 걱정했다","07:19"],["호시노","복도에서 낮잠을 잤다","07:19"],["시로코","선생님과 함께 순찰을 나가기로 했다","07:17"]].map(r=>`<div class="row"><span class="who">${r[0]}</span><span class="t">${r[1]}</span><span class="mut">${r[2]}</span></div>`).join("")}</section>`;
let cur="v6";
function draw(){bar.innerHTML=Object.entries(V).map(([k,x])=>`<button data-k="${k}" class="${k==cur?"on":""}">${x.n}</button>`).join("");cap.textContent=V[cur].c;
 wrap.innerHTML=["pc","mo"].map(f=>`<div><p class="cap">${f=="pc"?"PC 1280":"모바일 390"}</p><div class="frame ${f} ${cur}"><div class="stage">${rail}<div class="main">${body(cur)}</div></div></div></div>`).join("");}
bar.onclick=e=>{const k=e.target.dataset.k;if(k){cur=k;draw();}};draw();
</script></body></html>
