<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>글래스 홈 목업</title>
<style>
:root{
  --rb-bg:#160f2b;--rb-blob1:rgba(255,110,180,.55);--rb-blob2:rgba(100,120,255,.6);--rb-blob3:rgba(255,180,100,.4);--rb-blob4:rgba(150,90,255,.45);
  --rb-acc:#ff8ec6;--rb-acc2:#8a7bff;--rb-acc3:#ffb36b;--rb-tint:#ffd0ea;--rb-glow:rgba(255,142,198,.55);
  --rb-acc-grad:linear-gradient(90deg,var(--rb-acc),var(--rb-acc2));
  --rb-glass:rgba(255,255,255,.10);--rb-glass-2:rgba(255,255,255,.14);--rb-glass-line:rgba(255,255,255,.22);
  --rb-glass-hi:inset 0 1px 0 rgba(255,255,255,.25);--rb-glass-shadow:0 8px 30px rgba(0,0,0,.25);--rb-glass-blur:blur(22px) saturate(140%);
  --rb-text:#f2f0fa;--rb-sub:rgba(255,255,255,.65);--rb-mute:rgba(255,255,255,.55);--rb-line:rgba(255,255,255,.10);
  --rb-r2:15px;--rb-r3:20px;--rb-r4:22px;
}
*{box-sizing:border-box}
body{margin:0;background:#0b0816;color:var(--rb-text);font:14px/1.5 "Pretendard",system-ui,sans-serif;padding:24px 16px}
.cap{color:#aaa;font-size:13px;margin:0 0 8px}
.wrap{display:flex;gap:32px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.frame{border-radius:var(--rb-r4);overflow:hidden;border:1px solid #333}
.pc{width:1280px;max-width:100%}.mo{width:390px}
/* 배경(stage) */
.stage{background:
  radial-gradient(40% 50% at 12% 18%,var(--rb-blob1),transparent 70%),
  radial-gradient(45% 55% at 88% 78%,var(--rb-blob2),transparent 70%),
  radial-gradient(35% 40% at 70% 8%,var(--rb-blob3),transparent 70%),
  radial-gradient(40% 45% at 30% 95%,var(--rb-blob4),transparent 70%),var(--rb-bg);padding:22px;min-height:100%}
/* 탭 틀 */
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{font-weight:800;font-size:18px;background:linear-gradient(90deg,var(--rb-acc3),var(--rb-acc));-webkit-background-clip:text;color:transparent}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--rb-glass);border:1px solid var(--rb-glass-line);backdrop-filter:var(--rb-glass-blur)}
.tabs span{padding:6px 14px;border-radius:999px;color:var(--rb-sub);font-size:13px}
.tabs span.on{background:var(--rb-acc-grad);color:#fff;box-shadow:0 0 12px var(--rb-glow)}
.search{flex:1;max-width:260px;margin-left:auto;padding:8px 14px;border-radius:999px;background:var(--rb-glass);border:1px solid var(--rb-glass-line);color:var(--rb-mute);font-size:13px}
.ib{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--rb-glass);border:1px solid var(--rb-glass-line);color:var(--rb-sub);font-size:14px;flex:none}
/* 유리 카드 */
.glass{background:var(--rb-glass);-webkit-backdrop-filter:var(--rb-glass-blur);backdrop-filter:var(--rb-glass-blur);border:1px solid var(--rb-glass-line);border-radius:var(--rb-r3);box-shadow:var(--rb-glass-shadow),var(--rb-glass-hi);padding:18px 20px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ch b{font-size:15px}.link{color:var(--rb-sub);font-size:12px}
.body{display:grid;grid-template-columns:1fr 340px;gap:16px}
.col{display:flex;flex-direction:column;gap:16px}
.head small{color:var(--rb-sub);font-size:12px}.head h1{margin:2px 0 0;font-size:22px}
/* 스위치 */
.sw{width:42px;height:24px;border-radius:999px;background:rgba(255,255,255,.22);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.sw.on{background:var(--rb-acc-grad);box-shadow:0 0 12px var(--rb-glow)}.sw.on::after{left:21px}
.stat{display:flex;align-items:center;gap:10px;color:var(--rb-sub);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rb-acc);box-shadow:0 0 8px var(--rb-glow);flex:none}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.num{background:var(--rb-glass-2);border-radius:var(--rb-r2);padding:12px 14px}
.num b{display:block;font-size:24px;background:linear-gradient(180deg,#fff,var(--rb-tint));-webkit-background-clip:text;color:transparent}
.num small{font-size:12px;color:var(--rb-sub)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--rb-glass-2);border-radius:var(--rb-r2);padding:14px;display:flex;gap:10px;align-items:center}
.ico{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700}
.g1{background:linear-gradient(135deg,#ffb36b,#ff7a59)}.g2{background:linear-gradient(135deg,#ff8ec6,#8a7bff)}.g3{background:linear-gradient(135deg,#7fd4ff,#5b8cff)}.g4{background:linear-gradient(135deg,#6ff0c4,#38b6a0)}
.tile b{display:block;font-size:14px}.tile small{color:var(--rb-mute);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 12px;border-radius:20px;background:var(--rb-glass-2);font-size:13px}
.chip.new{background:var(--rb-acc-grad);font-size:11px;padding:2px 8px;margin-right:6px}
.disc{display:flex;align-items:center;gap:12px}
.disc .t{flex:1}.disc small{color:var(--rb-sub);display:block;font-size:12px}
.btn{padding:6px 14px;border-radius:999px;background:var(--rb-acc-grad);color:#fff;font-size:13px;border:0}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rb-line)}
.row:last-child{border-bottom:0}.row .t{flex:1}.row small{display:block;color:var(--rb-mute);font-size:12px}
.time{color:var(--rb-mute);font-size:12px}
.ghost{border:1px dashed rgba(255,255,255,.3);border-radius:999px;padding:7px 14px;color:var(--rb-sub);font-size:13px;display:inline-block}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.addon{display:flex;gap:10px;align-items:center}.addon .t{flex:1}
/* 모바일 */
.mo .stage{padding:16px}.mo .glass{padding:16px}
.mo .body{grid-template-columns:1fr}
.mo .tabs span{padding:6px 9px;font-size:12px}.mo .search{display:none}
.mo .nums{grid-template-columns:repeat(3,1fr)}.mo .only-pc{display:none}
.mo .tiles{grid-template-columns:repeat(4,1fr);gap:8px}.mo .tile{flex-direction:column;padding:10px 4px;text-align:center}.mo .tile small{display:none}.mo .tile b{font-size:12px}
.mo .head h1{font-size:18px}
</style></head><body>
