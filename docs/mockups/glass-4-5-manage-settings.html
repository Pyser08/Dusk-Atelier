<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리·설정 목업</title>
<style>
:root{
  --bg:#0f1426;--b1:rgba(95,212,255,.42);--b2:rgba(63,207,166,.42);--b3:rgba(176,124,255,.38);--b4:rgba(255,154,118,.32);
  --acc:#6aaeff;--acc2:#7fd4ff;--tint:#dbe9ff;
  --secg:linear-gradient(135deg,#7fd4ff,#5b8cff);
  --glass:color-mix(in srgb,#0f1426 46%,transparent);--cell:rgba(255,255,255,.08);--line:rgba(255,255,255,.2);
  --text:#f2f5fa;--sub:rgba(255,255,255,.84);--mute:rgba(255,255,255,.62);--rl:rgba(255,255,255,.1);
}
*{box-sizing:border-box}
body{margin:0;background:#070a14;color:var(--text);font:14px/1.5 "Pretendard",system-ui,sans-serif;padding:20px 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 10px}
.bar button{padding:7px 14px;border-radius:999px;border:1px solid #3a4258;background:#141a2c;color:#ddd;font:inherit;cursor:pointer}
.bar button.on{background:var(--secg);color:#05121a;border:0;font-weight:700}
.cap{color:#bbb;font-size:13px;margin:0 auto 14px;max-width:1100px;text-align:center}
.wrap{display:flex;gap:32px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.frame{border-radius:22px;overflow:hidden;border:1px solid #333}
.pc{width:1280px;max-width:100%}.mo{width:390px}
.lbl{color:#999;font-size:12px;text-align:center;margin:0 0 6px}
.stage{background:radial-gradient(40% 50% at 12% 18%,var(--b1),transparent 70%),radial-gradient(45% 55% at 88% 78%,var(--b2),transparent 70%),radial-gradient(35% 40% at 70% 8%,var(--b3),transparent 70%),radial-gradient(40% 45% at 30% 95%,var(--b4),transparent 70%),var(--bg);padding:22px;display:flex;gap:16px;min-height:820px}
.mo .stage{padding:14px 14px 0;flex-direction:column;min-height:844px;gap:12px}
/* 카드: 스크롤 안 카드는 블러 없음(깜빡임 수정 규칙) */
.gl{background:var(--glass);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.22);position:relative}
.pad{padding:18px 20px}.mo .pad{padding:16px}
.rail{width:68px;flex:none;display:flex;flex-direction:column;gap:6px;padding:14px 10px;align-items:center;border-radius:20px;backdrop-filter:blur(22px)}
.ri{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--sub)}
.ri.on{background:var(--secg);color:#05121a;box-shadow:0 0 14px rgba(95,212,255,.5)}
.ri.sub{width:34px;height:34px}.ri.sub.cur{color:var(--acc);background:rgba(95,212,255,.12);border:1px solid rgba(95,212,255,.5)}
.rsep{width:28px;height:1px;background:var(--rl);margin:4px 0}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.mo .main{gap:12px;padding-bottom:84px}
.mut{color:var(--mute);font-size:12.5px}
.head{display:flex;align-items:flex-end;gap:12px}.sp{flex:1}
.ttl{font-size:26px;font-weight:800;background:linear-gradient(90deg,#fff,var(--tint));-webkit-background-clip:text;color:transparent;text-shadow:0 0 14px rgba(95,212,255,.35)}
.mo .ttl{font-size:21px}
.crumb{font-size:12px;color:var(--mute)}
.q{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--sub);flex:none;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--cell);font-size:12px;color:var(--sub);white-space:nowrap}
.chips .chip{padding:6px 13px;font-size:12.5px;cursor:pointer}.chips .on{color:#fff;box-shadow:inset 0 0 0 1px var(--acc),0 0 10px rgba(95,212,255,.35)}
.c1{--c:#5fd4ff;--cg:linear-gradient(180deg,#7fe0ff,#4a9dff)}.c2{--c:#3fcfa6;--cg:linear-gradient(180deg,#6ff0c4,#38b6a0)}.c3{--c:#b07cff;--cg:linear-gradient(180deg,#d2a6ff,#8a7bff)}.c4{--c:#ff8a5c;--cg:linear-gradient(180deg,#ffb36b,#ff7a59)}.c5{--c:#ffd166;--cg:linear-gradient(180deg,#ffe08a,#f5b43c)}.c6{--c:#ff7eb6;--cg:linear-gradient(180deg,#ff9ccc,#e8609c)}
.band{padding-left:24px}
.band::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--cg);box-shadow:0 0 10px var(--c)}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,#5fd4ff) 10%,transparent);border:1px solid color-mix(in srgb,var(--c,#5fd4ff) 55%,transparent);color:var(--c,#5fd4ff);box-shadow:0 0 8px color-mix(in srgb,var(--c,#5fd4ff) 35%,transparent)}
.ico.s{width:32px;height:32px;border-radius:10px}
.ico svg,.ri svg{width:19px;height:19px}
.cta{display:inline-block;text-align:center;padding:10px 18px;border-radius:999px;font-weight:700;color:#d6f6ff;background:color-mix(in srgb,var(--acc) 14%,transparent);border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);box-shadow:0 0 10px color-mix(in srgb,var(--acc) 30%,transparent);white-space:nowrap;cursor:pointer}
.btn{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--cell);border:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.btn.warn{border-color:rgba(255,120,120,.5);color:#ffb3b3}
.dot{width:9px;height:9px;border-radius:50%;background:#5fe0a8;box-shadow:0 0 8px #5fe0a8;flex:none;display:inline-block}
.dot.off{background:#777;box-shadow:none}.dot.warn{background:#ffd166;box-shadow:0 0 8px #ffd166}
.sw{display:inline-block;width:40px;height:23px;border-radius:999px;background:rgba(255,255,255,.2);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff}
.sw.on{background:color-mix(in srgb,#5fe0a8 30%,transparent);box-shadow:0 0 10px rgba(95,224,168,.45)}.sw.on::after{left:20px;background:#5fe0a8}
.seg{display:inline-flex;border-radius:999px;background:var(--cell);padding:3px;gap:2px}
.seg span{padding:4px 11px;border-radius:999px;font-size:12px;color:var(--sub);white-space:nowrap}.seg .on{background:rgba(95,212,255,.2);color:#fff;box-shadow:inset 0 0 0 1px rgba(95,212,255,.6)}
.val{font-size:12.5px;color:var(--sub);padding:5px 12px;border-radius:10px;background:var(--cell);white-space:nowrap}
.val::after{content:" ▾";color:var(--mute)}
.meter{width:120px;height:7px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;flex:none}.meter i{display:block;height:100%;background:var(--secg)}
.slider{width:140px;height:5px;border-radius:9px;background:rgba(255,255,255,.15);position:relative;flex:none}.slider i{position:absolute;left:0;top:0;bottom:0;background:var(--secg);border-radius:9px}.slider b{position:absolute;top:-6px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--acc)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rl)}
.row:first-child{border-top:0}
.rt{flex:1;min-width:0}.rn{font-weight:650}.rd{font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.mo .rd{white-space:normal}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:6px}.sh h3{margin:0;font-size:15.5px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.mo .g2,.mo .g3,.mo .g4{grid-template-columns:1fr}
.mo .g2.keep{grid-template-columns:1fr 1fr}
.stat{display:flex;gap:10px;flex-wrap:wrap}.st{padding:10px 14px;border-radius:12px;background:var(--cell);min-width:96px}.st b{display:block;font-size:19px}.st span{font-size:12px;color:var(--mute)}
.mo .st{flex:1;min-width:80px;padding:8px 10px}.mo .st b{font-size:16px}
.hero{display:flex;gap:18px;align-items:center}
.mo .hero{flex-direction:column;align-items:stretch;gap:12px}
.hero .big{width:64px;height:64px;border-radius:18px}.hero .big svg{width:30px;height:30px}
.htt{font-size:20px;font-weight:800}
.md{display:flex;gap:16px;align-items:flex-start}.md>.lst{width:300px;flex:none}.md>.det{flex:1;min-width:0}
.mo .md{flex-direction:column;align-items:stretch}.mo .md>.det{width:100%}.mo .md>.lst{width:100%}
.li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer}.li.on{background:rgba(95,212,255,.12);box-shadow:inset 0 0 0 1px rgba(95,212,255,.45)}
.li .rn{font-size:13.5px}
.tile{padding:14px;border-radius:14px;background:var(--cell);display:flex;flex-direction:column;gap:8px;min-height:104px}
.tile .rn{font-size:13.5px}
.mo .tiles{grid-template-columns:1fr 1fr}
.sws{display:flex;gap:8px;flex-wrap:wrap}.swt{width:52px;height:52px;border-radius:14px;border:2px solid transparent;position:relative}.swt.on{border-color:#fff;box-shadow:0 0 12px var(--acc)}.swt small{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--mute);white-space:nowrap}
.mo .swt{width:44px;height:44px}
.chat{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.bub{max-width:80%;padding:8px 11px;border-radius:14px}
.field{display:flex;flex-direction:column;gap:5px;padding:10px 0;border-top:1px solid var(--rl)}.field:first-child{border-top:0}
.fl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);font-weight:650}
.fi{background:rgba(0,0,0,.22);border:1px solid var(--rl);border-radius:10px;padding:8px 11px;font-size:13px;color:var(--sub);min-height:36px}
.ai{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid rgba(176,124,255,.6);color:#d9c3ff;margin-left:auto}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--rl)}.step:first-child{border-top:0}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:var(--cell);flex:none}.num.on{background:var(--secg);color:#05121a}.num.ok{background:rgba(95,224,168,.25);color:#5fe0a8}
.opt{padding:12px;border-radius:14px;background:var(--cell);border:1px solid transparent}.opt.on{border-color:rgba(95,212,255,.7);box-shadow:0 0 10px rgba(95,212,255,.25)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;justify-content:space-around;align-items:center;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(22px);border-top:1px solid var(--line);font-size:10.5px;color:var(--mute)}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px}.tabbar svg{width:20px;height:20px}.tabbar .on{color:var(--acc)}
.mo .stage{position:relative}
.foot{font-size:12px;color:var(--mute);text-align:center}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;background:rgba(95,212,255,.14);color:var(--acc);border:1px solid rgba(95,212,255,.4);white-space:nowrap}
.tag.g{background:rgba(95,224,168,.14);color:#5fe0a8;border-color:rgba(95,224,168,.4)}.tag.o{background:rgba(255,209,102,.12);color:#ffd166;border-color:rgba(255,209,102,.4)}.tag.p{background:rgba(176,124,255,.14);color:#d2a6ff;border-color:rgba(176,124,255,.45)}
.note{font-size:12.5px;color:#ffe3a3;background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.35);border-radius:12px;padding:9px 12px}
/* 탭별 맞춤 안 */
.flow{display:grid;grid-template-columns:1fr 34px 1fr 34px 1fr;align-items:stretch;gap:0}
.flow .arr{display:grid;place-items:center;color:var(--acc);font-size:20px;text-shadow:0 0 8px var(--acc)}
.mo .flow{grid-template-columns:1fr}.mo .flow .arr{transform:rotate(90deg);height:26px}
.node{padding:10px 12px;border-radius:12px;background:var(--cell);margin-top:8px;font-size:13px;border:1px solid transparent}.node.on{border-color:rgba(95,212,255,.6);box-shadow:0 0 10px rgba(95,212,255,.2)}
.node small{display:block;color:var(--mute);font-size:11.5px}
table.mx{width:100%;border-collapse:collapse;font-size:13px}table.mx th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--rl)}table.mx td{padding:10px 8px;border-bottom:1px solid var(--rl)}
.mo table.mx .hm{display:none}
.wiz{display:flex;gap:6px;margin-bottom:14px}.wiz div{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.14)}.wiz .on{background:var(--secg);box-shadow:0 0 8px var(--acc)}
.wizl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin:-8px 0 12px}.wizl .on{color:#fff;font-weight:700}
.prev{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,154,118,.35),rgba(176,124,255,.4)),#171028;padding:12px;display:flex;gap:10px;min-height:250px}
.prev .pr{width:34px;border-radius:10px;background:rgba(255,255,255,.1)}.prev .pm{flex:1;display:flex;flex-direction:column;gap:8px}.prev .pc2{border-radius:10px;background:rgba(255,255,255,.1);padding:8px 10px;font-size:12px}
.mood{padding:14px;border-radius:14px;cursor:pointer;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line)}.mood.on{box-shadow:0 0 0 2px #fff,0 0 14px var(--acc)}
.acc{border-top:1px solid var(--rl);padding:12px 0}.acc:first-child{border-top:0}.acch{display:flex;align-items:center;gap:12px;font-weight:650}.accb{padding:6px 0 0 44px}
.big-prev{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:10px}.big-prev .nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}.dots i.on{background:var(--acc);width:20px;border-radius:9px}
.check{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--rl)}.check:first-child{border-top:0}.cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}.cb.on{background:rgba(95,224,168,.25);border-color:#5fe0a8;color:#5fe0a8}
.prompt{display:flex;gap:10px;align-items:flex-end}.prompt .fi{flex:1;min-height:84px;font-size:14px}
.msg{display:flex;gap:10px;margin:10px 0}.msg .bubble{padding:10px 13px;border-radius:14px;background:var(--cell);font-size:13px;max-width:85%}.msg.me{justify-content:flex-end}.msg.me .bubble{background:rgba(95,212,255,.15);border:1px solid rgba(95,212,255,.35)}
.gen{padding:14px;border-radius:14px;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;border:1px solid var(--line)}
.reel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.mo .reel{grid-template-columns:1fr 1fr}
.rl{border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);padding:10px;text-align:center;font-size:12.5px;position:relative;min-height:120px;display:flex;flex-direction:column;gap:6px}.rl .w{font-size:14px;font-weight:700;color:#fff;flex:1;display:grid;place-items:center}.rl.lock{border-color:#ffd166;box-shadow:0 0 10px rgba(255,209,102,.3)}
.lever{width:56px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}.lever .stick{width:6px;height:120px;border-radius:6px;background:linear-gradient(#ddd,#888)}.lever .ball{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9ccc,#e8609c);box-shadow:0 0 14px #ff7eb6}
.pcard{border-radius:18px;padding:18px;background:linear-gradient(160deg,rgba(176,124,255,.3),rgba(95,212,255,.15));border:1px solid var(--line)}
.ava{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#3a2b7a,#ff7eb6);display:grid;place-items:center;font-size:28px;font-weight:800}
.qa{padding:12px 14px;border-radius:14px;background:var(--cell);display:flex;gap:10px;align-items:center}.qa .rn{font-size:13.5px}
.search{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--mute)}
.kbd{font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--mute)}
.tl{position:relative;padding-left:22px}.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--rl)}
.tli{position:relative;padding:8px 0 12px}.tli::before{content:"";position:absolute;left:-19px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}.tli.p::before{background:#d2a6ff;box-shadow:0 0 8px #d2a6ff}

.ide{display:grid;grid-template-columns:240px 1fr 260px;gap:16px}.mo .ide{grid-template-columns:1fr}
.tree div{padding:5px 8px;border-radius:8px;font-size:13px}.tree .on{background:rgba(95,212,255,.12)}.tree .in{padding-left:24px;color:var(--sub)}
</style></head><body>

const draw=()=>{
 const t=TABS[cur],v=V[cur][vi];
 document.getElementById('tabs').innerHTML=ORDER.map(id=>`<button class="${id===cur?'on':''}" data-t="${id}">${TABS[id].label}</button>`).join('');
 document.getElementById('vars').innerHTML=V[cur].map((x,k)=>`<button class="${k===vi?'on':''}" data-v="${k}">${x.n}</button>`).join('');
 document.getElementById('cap').textContent=v.cap;
 document.getElementById('pc').innerHTML=rail(cur)+`<div class="main">${header(t,0)}${v.r(0)}<div class="foot">? 도움말 · 기능 찾기 · 처음 둘러보기 유지</div></div>`;
 document.getElementById('mo').innerHTML=`<div class="main">${header(t,1)}${subchips(cur)}${v.r(1)}</div>${tabbar(cur)}`;
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-t],[data-v]');if(!b)return;if(b.dataset.t){cur=b.dataset.t;vi=0}else vi=+b.dataset.v;draw();});
draw();
</script>
</body></html>
