<!doctype html><html lang=ko><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>인카운터 줄</title>
<link rel=stylesheet href=/font/noto-sans-kr/500.css><link rel=stylesheet href=/font/noto-sans-kr/700.css><link rel=stylesheet href=/font/noto-sans-kr/900.css>
<style>
body{margin:0;background:#22232a;color:#d9d9e0;font:500 15px/1.75 "Noto Sans KR",sans-serif}.log{max-width:760px;margin:auto;padding:20px 16px 80px}.msg{margin:22px 0}.msg>b{display:block;color:#f0f0f5;margin-bottom:4px}.me{color:#9fc0f2}
/* 인카운터 줄: 메시지 폭을 꽉 채운다. 애드온으로 옮길 때 이 덩어리만 쓴다 */
.ds-enc{position:relative;display:block;width:100%;min-height:76px;margin:14px 0 4px;padding:0;border:0;overflow:hidden;isolation:isolate;background:#b5202b;color:#fff;font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:ds-open .55s cubic-bezier(.2,1.5,.4,1) both}
.ds-enc::before,.ds-enc::after{content:"";position:absolute;left:-60px;right:-60px;height:9px;z-index:-1;background:repeating-linear-gradient(-60deg,#1c1626 0 14px,#f2b134 14px 28px);background-size:32px 100%;animation:ds-run .9s linear infinite}.ds-enc::before{top:0}.ds-enc::after{bottom:0;animation-direction:reverse}
.ds-bg{position:absolute;inset:0;z-index:-2;overflow:hidden}.ds-bg i{position:absolute;top:50%;left:calc(var(--i)*17%);width:120px;height:104px;margin-top:-52px;background:#8c131f;clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.55;animation:ds-tri 3.6s calc(var(--i)*-.6s) linear infinite}
.ds-in{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:17px 18px 17px 14px}.ds-in svg{width:52px;height:46px;animation:ds-hit .7s .12s cubic-bezier(.2,1.7,.4,1) both}.ds-in .w{animation:ds-blink 1.3s infinite}
.ds-t{min-width:0}.ds-t b{display:block;font:900 22px/1.15 "Noto Sans KR",sans-serif;letter-spacing:.02em}.ds-t span{display:block;font-size:13px;line-height:1.4;font-weight:700;color:#ffdcdc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-go{padding:9px 26px 10px 30px;margin-right:-18px;background:#1c1626;color:#f2b134;font-weight:900;font-size:17px;clip-path:polygon(16px 0,100% 0,100% 100%,0 100%);transition:transform .35s cubic-bezier(.2,1.7,.4,1),background .15s,color .15s}.ds-enc:hover .ds-go,.ds-enc:focus-visible .ds-go{background:#f2b134;color:#1c1626;transform:translateX(-8px)}.ds-enc:active{transform:scale(.985)}.ds-enc:focus-visible{outline:3px solid #f2b134;outline-offset:2px}
.ds-enc.win{background:#2f6fd6}.ds-enc.win i{background:#1f4fa8}.ds-enc.lose,.ds-enc.gone{background:#55505e}.ds-enc.lose i,.ds-enc.gone i{background:#46414f}.ds-enc:is(.win,.lose,.gone)::before,.ds-enc:is(.win,.lose,.gone)::after{animation:none;background:#1c1626}.ds-enc:is(.win,.lose,.gone) .ds-bg i,.ds-enc:is(.win,.lose,.gone) .w{animation:none}.ds-enc.gone{cursor:default;opacity:.75}
.ds-enc.enter{animation:ds-in .6s forwards;z-index:9}
@keyframes ds-open{from{clip-path:inset(50% 0);transform:scaleX(.9)}to{clip-path:inset(0)}}@keyframes ds-run{to{background-position-x:32px}}@keyframes ds-tri{from{transform:translateX(-140px)}to{transform:translateX(140px)}}@keyframes ds-hit{from{transform:scale(3.4) rotate(-40deg);opacity:0}}@keyframes ds-blink{50%{fill:#fff}}@keyframes ds-in{to{transform:scale(1.25);filter:brightness(2.4);opacity:0}}
@media(max-width:480px){.ds-t b{font-size:19px}.ds-go{padding:9px 20px 10px 26px;font-size:15px}.ds-in{gap:10px}.ds-in svg{width:42px;height:38px}}@media(prefers-reduced-motion:reduce){.ds-enc,.ds-enc *,.ds-enc::before,.ds-enc::after{animation:none!important}}
</style><div class=log id=log></div><script>
const line=(o)=>`<button class="ds-enc ${o.s||""}" ${o.s==="gone"?"disabled":""} aria-label="${o.t}. ${o.d}"><span class=ds-bg>${[0,1,2,3,4,5].map(i=>`<i style="--i:${i}"></i>`).join("")}</span><span class=ds-in><svg viewBox="-100 -92 200 170" aria-hidden=true><path fill="#1c1626" d="M0-92 98 78H-98z"/><path class=w fill="#f2b134" d="M0-66 72 64H-72z"/><path fill="#1c1626" d="M0-36 8 24H-8zM0 32a9 9 0 1 1 0 18 9 9 0 0 1 0-18z"/></svg><span class=ds-t><b>${o.t}</b><span>${o.d}</span></span><span class=ds-go>${o.g}</span></span></button>`;
log.innerHTML=`<div class=msg><b>세라</b>다리 건너편에서 쇠붙이 부딪는 소리가 들렸다. 안개 속에서 도끼를 든 그림자들이 하나둘 모습을 드러냈다.<br>"…숨을 곳은 없어. 준비해." 세라가 지팡이를 고쳐 쥐었다.${line({t:"교전",d:"끊어진 수로 · 약탈자 5 · 철갑 대장",g:"전투"})}</div>
<div class="msg me"><b>나</b>아래는 다른 상태의 모습이다.</div><div class=msg><b>세라</b>지난 전투.${line({s:"win",t:"승리",d:"절벽 사원 · 6턴 · 격파 5",g:"기록"})}${line({s:"lose",t:"패배",d:"화산 · 4턴 · 아린 쓰러짐",g:"기록"})}${line({s:"gone",t:"무효",d:"이 메시지가 바뀌어 전투가 사라졌어요",g:"—"})}</div>`;
log.addEventListener("click",(e)=>{const b=e.target.closest(".ds-enc");if(!b||b.classList.contains("gone"))return;b.classList.add("enter");setTimeout(()=>{location.href="/"},480)});
</script>
