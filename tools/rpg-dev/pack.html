<!doctype html><html lang=ko><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>새 그림 시안</title>
<link rel=stylesheet href=/font/noto-sans-kr/700.css><link rel=stylesheet href=/font/noto-sans-kr/900.css>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;overflow:hidden;background:#0c0814;color:#fff;font:700 15px "Noto Sans KR",sans-serif}canvas{display:block;touch-action:none}button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#load{position:fixed;inset:0;z-index:9;display:grid;place-content:center;gap:14px;background:#0c0814;text-align:center}#load span{display:block;width:220px;height:4px;background:#2a2038}#load i{display:block;height:100%;width:0;background:#e9a95f;transition:width .2s}
#top{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top));display:flex;justify-content:space-between;gap:30px;max-width:900px;margin:auto;padding:0 14px;pointer-events:none}.pl{flex:1;max-width:340px;text-shadow:0 1px 4px #000}.pl b{font:900 19px "Noto Sans KR"}.pl span{display:block;height:9px;margin:5px 0 2px;background:#000a;transform:skewX(-18deg);overflow:hidden}.pl i{display:block;height:100%;background:linear-gradient(90deg,#2f8fe0,#8fe0ff);transition:width .5s cubic-bezier(.2,1.3,.4,1)}.pl.e{text-align:right}.pl.e span{transform:skewX(18deg)}.pl.e i{margin-left:auto;background:linear-gradient(270deg,#d83f3f,#ff9a6a)}.pl em{font:900 20px "Noto Sans KR"}.pl small{font-size:12px;opacity:.7}
#cmd{position:fixed;right:0;bottom:calc(74px + env(safe-area-inset-bottom));display:grid;gap:7px;width:170px}#cmd button{min-height:48px;padding:0 16px 0 34px;text-align:left;background:#14101ee6;clip-path:polygon(18px 0,100% 0,100% 100%,0 100%);transition:transform .3s cubic-bezier(.2,1.7,.4,1)}#cmd button:active{transform:translateX(-10px)}#cmd .u{background:#e9a95f;color:#1c1226;font-weight:900}
#who{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px;flex-wrap:wrap}#who button{min-height:44px;padding:0 14px;background:#14101ecc}#who .on{background:#2f6fd6}#th{position:fixed;left:10px;bottom:calc(74px + env(safe-area-inset-bottom));display:grid;gap:6px}#th button{min-height:40px;padding:0 12px;background:#14101e99;font-size:12px}.ult #top,.ult #cmd,.ult #who,.ult #th{opacity:0;pointer-events:none;transition:opacity .15s}
body::before,body::after{content:"";position:fixed;left:0;right:0;height:0;background:#000;z-index:4;transition:height .3s}body::before{top:0}body::after{bottom:0}.ult::before,.ult::after{height:9vh}
.fl{position:fixed;inset:0;z-index:3;opacity:0;pointer-events:none}#app::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(transparent 45%,#05020c);opacity:var(--vg,.5)}canvas{will-change:transform}.dm{position:fixed;z-index:6;translate:-50% -50%;font:900 34px "Noto Sans KR";color:#fff;-webkit-text-stroke:6px #1a1024;paint-order:stroke fill;pointer-events:none;animation:dm 1.1s forwards}.dm.c{font-size:62px;color:#ffcf5a}@keyframes dm{0%{scale:.3 2}10%{scale:1.5 .8}20%{scale:1}60%{opacity:1}100%{margin-top:-60px;opacity:0}}
.cut2{position:fixed;z-index:5;left:-5%;right:-5%;bottom:17vh;height:17vh;transform:rotate(-4deg);overflow:hidden;animation:ci .35s cubic-bezier(.2,1.2,.4,1)}.cut2 i{position:absolute;inset:0;background:linear-gradient(90deg,#000d,#0009 60%,transparent);border-block:3px solid var(--uc)}.cut2 b{position:absolute;left:12%;top:50%;translate:0 -50%;font:900 clamp(36px,10vw,92px)/1 "Noto Sans KR";letter-spacing:.06em;-webkit-text-stroke:8px #0c0814;paint-order:stroke fill;text-shadow:0 0 34px var(--uc);animation:cn .5s .08s cubic-bezier(.2,1.4,.4,1) backwards;white-space:nowrap}.cut2.bye{animation:co .35s forwards}@keyframes ci{from{clip-path:inset(50% 0)}to{clip-path:inset(0)}}@keyframes co{to{clip-path:inset(50% 0)}}@keyframes cn{from{translate:-70% -50%;scale:1.5 .7;opacity:0}}
@media(max-height:520px){#cmd{bottom:12px;width:150px;gap:4px}#cmd button{min-height:42px}#who{right:160px;left:90px}#th{bottom:12px}}</style>
<div id=app></div><div id=load><b>불러오는 중</b><span><i></i></span></div><div id=top></div><div id=th><button data-t=crypt>지하 묘소</button><button data-t=dawn>새벽</button></div><div id=cmd></div><div id=who></div><script type=module src=/pack3d.js></script>
