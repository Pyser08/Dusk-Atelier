name: Temporary v1.8.1 validation
on:
  push:
    branches:
      - feat/1.8.1
permissions:
  contents: write
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1.8.1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
      - run: node --check dusk_atelier.js
      - name: Commit built plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dusk_atelier.js
          if ! git diff --cached --quiet; then
            git commit -m "Build Dusk Atelier v1.8.1"
            git push origin HEAD:feat/1.8.1
          fi
