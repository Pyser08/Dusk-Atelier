name: Validate and build v1.8.1
on:
  push:
    branches:
      - fix/1.8.1-noop-toast
permissions:
  contents: write
jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1.8.1-noop-toast
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
      - run: node --check dusk_atelier.js
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dusk_atelier.js
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate dusk_atelier.js for v1.8.1"
            git push origin HEAD:fix/1.8.1-noop-toast
          fi
