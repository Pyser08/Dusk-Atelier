name: 배포 (원격 실행)

# 클라우드 AI 세션은 작업 브랜치에만 push할 수 있어서 태그·addons 브랜치를 못 올린다.
# 이 워크플로를 수동 실행(workflow_dispatch)하면 GitHub 서버에서 tools/release.mjs를 그대로 돌린다:
#   시험 → 빌드 확인 → 브랜치를 main에 합침 → main·태그 push → 애드온 배포(addons 브랜치) → GitHub 릴리스.
# GITHUB_TOKEN으로 올린 태그는 release.yml을 깨우지 않으므로 릴리스는 여기서 직접 만든다.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '배포할 작업 브랜치 (package.json 버전 = CHANGELOG 맨 위)'
        required: true
      addons:
        description: '애드온도 배포'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: git 사용자
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: release.mjs
        run: node tools/release.mjs ${{ format('{0}', inputs.addons) == 'false' && '--no-addons' || '' }}
      - name: GitHub 릴리스
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          awk -v h="## $TAG" 'index($0,h)==1{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "Dusk Atelier $TAG" > notes.md
          git fetch -q origin main
          git checkout -q origin/main -- dusk_atelier.js
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dusk_atelier.js --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dusk_atelier.js --verify-tag --title "Dusk Atelier $TAG" --notes-file notes.md --latest
          fi
