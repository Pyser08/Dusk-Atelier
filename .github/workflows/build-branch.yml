name: 브랜치 빌드

# feat/* 브랜치에 src/가 바뀌어 푸시되면 테스트·빌드만 검증한다. 빌드 결과를 브랜치에 다시 커밋하지 않는다(봇 커밋이 끼어 푸시가 거절되던 문제). dusk_atelier.js는 로컬에서 npm run build 해서 직접 올린다.
# v1.6.3: 변경 기록까지 포함해 최신 소스 상태로 다시 빌드
on:
  push:
    branches: ['feat/**']
    paths: ['src/**', 'tools/**', 'tests/**', 'package.json', '.github/workflows/build-branch.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: 캐릭터 분리 단위 테스트
        run: npm test
      - run: node tools/build.mjs
