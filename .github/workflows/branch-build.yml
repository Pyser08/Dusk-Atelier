name: Branch build verification

on:
  push:
    branches:
      - 'research/**'
      - 'feature/**'
      - 'feat/**'
    paths:
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/branch-build.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Character split unit tests
        run: npm test
      - name: Build plugin
        run: node tools/build.mjs
      - name: Syntax check
        run: node --check dusk_atelier.js
      - name: Commit built plugin to the source branch
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if git diff --quiet -- dusk_atelier.js; then echo "No bundle changes"; else
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add dusk_atelier.js
            git commit -m "build: dusk_atelier.js v$(node -p "require('./package.json').version")"
            if [ "${{ github.event_name }}" = "pull_request" ]; then target="${{ github.event.pull_request.head.ref }}"; else target="${{ github.ref_name }}"; fi
            git push origin "HEAD:$target"
          fi
      - name: Upload built plugin
        uses: actions/upload-artifact@v4
        with:
          name: dusk_atelier-${{ github.sha }}
          path: dusk_atelier.js
          if-no-files-found: error
          retention-days: 14
