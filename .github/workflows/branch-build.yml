name: Branch build verification

# 검증만 한다(테스트·빌드·문법). 빌드 결과를 브랜치에 다시 커밋하지 않는다 — 로컬에서 npm run build 한 dusk_atelier.js를 직접 올리므로
# 봇 커밋이 끼어 푸시가 거절되는 일을 막는다.

on:
  push:
    branches:
      - 'research/**'
      - 'feature/**'
      - 'feat/**'
    paths:
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/branch-build.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Character split unit tests
        run: npm test
      - name: Build plugin
        run: node tools/build.mjs
      - name: Syntax check
        run: node --check dusk_atelier.js
