name: Character split build check
on:
  push:
    branches:
      - feat/character-split-v1.6.2
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'build: update v1.6.2 bundle')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node tools/test-charsplit.mjs
      - name: Commit generated plugin bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dusk_atelier.js
          if git diff --cached --quiet; then
            echo "Bundle is already current."
          else
            git commit -m "build: update v1.6.2 bundle"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dusk_atelier-v1.6.2
          path: dusk_atelier.js
