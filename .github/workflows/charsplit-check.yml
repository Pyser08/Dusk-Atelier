name: Character split build check
on:
  push:
    branches:
      - feat/character-split-v1.6.2
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: node tools/test-charsplit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dusk_atelier-v1.6.2
          path: dusk_atelier.js
